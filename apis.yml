aid: brightback
name: brightback
description: >-
  Brightback (now Chargebee Retention) is a churn-prevention and cancellation-
  experience platform for subscription businesses. When a customer clicks
  "cancel," Brightback intercepts the flow with a personalized, hosted save
  experience — targeted offers, surveys, and deflection paths — driven by
  customer and billing context passed from the merchant. Founded as a
  standalone SaaS backed by Point Nine and other investors, Brightback was
  acquired by Chargebee in 2021 and operates as Chargebee Retention. Developers
  integrate via the brightbackjs client library or a server-side pre-cancel API
  that returns a unique Cancel Session URL, with HMAC-SHA-512 signed requests for
  backend calls.
